name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        run: xmake config --yes --mode=releasedbg

      - name: Compile
        run: xmake build --yes --verbose SkyrimCompanion

      - name: Package for Vortex
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter SkyrimCompanion.dll | Select-Object -First 1
          if (-not $dll) { throw "SkyrimCompanion.dll was not produced" }
          $out = "package/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path "$out/SkyrimCompanion" | Out-Null
          Copy-Item $dll.FullName $out
          $pdb = Join-Path $dll.DirectoryName "SkyrimCompanion.pdb"
          if (Test-Path $pdb) { Copy-Item $pdb $out }
          Copy-Item web/* "$out/SkyrimCompanion" -Recurse
          Get-ChildItem package -Recurse | Select-Object FullName

      - name: Upload mod files
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimCompanion-${{ github.run_number }}
          path: package/
          if-no-files-found: error
