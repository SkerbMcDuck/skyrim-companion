<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyrim Companion</title>
<style>
  @font-face { font-family: "Sovngarde"; src: url("assets/fonts/Sovngarde.ttf") format("truetype"); }
  /* Lean hub: world map in the middle, quest log + level/skills on the left, local map + active effects on the right. */
  :root {
    --bg: #07090a; --panel: rgba(16, 18, 19, .94); --line: #3a3d3f; --line-soft: #26292b;
    --fg: #ece8df; --fg-dim: #aaa69d; --fg-mute: #77736b; --gold: #d8b25a; --bad: #e05040; --good: #84c26e;
    --font: "Sovngarde", "Futura", "Century Gothic", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.3 var(--font); overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 6px; padding: 6px 8px 8px; }
  .topbar { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--line); padding-bottom: 4px; min-width: 0; }
  .loc { font-size: 20px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loc2 { font-size: 13px; color: var(--fg-dim); white-space: nowrap; }
  .when { margin-left: auto; font-size: 13px; color: var(--fg-dim); white-space: nowrap; }
  .conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-mute); white-space: nowrap; }
  .cdot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  .cdot.ok { background: var(--good); } .cdot.wait { background: var(--gold); } .cdot.bad { background: var(--bad); }

  .grid { min-height: 0; display: grid; grid-template-columns: minmax(260px, 24fr) minmax(0, 50fr) minmax(280px, 26fr); gap: 6px; }
  .col { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .panel { background: var(--panel); border: 1px solid var(--line-soft); min-height: 0; min-width: 0; display: flex; flex-direction: column; flex: 0 0 auto; }
  .panel.grow { flex: 1 1 0; }
  .ph { display: flex; align-items: baseline; gap: 8px; padding: 5px 10px 4px; border-bottom: 1px solid var(--line-soft); }
  .ph h2 { margin: 0; font: 400 13px/1 var(--font); letter-spacing: .18em; text-transform: uppercase; color: var(--fg-dim); }
  .ph .meta { margin-left: auto; font-size: 12px; color: var(--fg-mute); white-space: nowrap; }
  .pb { padding: 6px 10px 8px; min-height: 0; overflow: auto; flex: 1 1 auto; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .num { font-variant-numeric: tabular-nums; }
  .dim { color: var(--fg-dim); } .mute { color: var(--fg-mute); }
  .empty { color: var(--fg-mute); font-size: 13px; padding: 2px 0; }
  .grp { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-mute); margin: 10px 0 3px; }
  .grp:first-child { margin-top: 0; }
  .bar { height: 5px; background: #222527; position: relative; overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; display: block; background: var(--fg-dim); }
  .chipbtn { font: 12px var(--font); letter-spacing: .12em; text-transform: uppercase; background: rgba(8,10,11,.8); color: var(--fg-dim);
    border: 1px solid var(--line); padding: 2px 9px; cursor: pointer; }
  .chipbtn:hover { color: var(--fg); } .chipbtn.on { color: var(--fg); border-color: var(--fg-dim); }

  /* quest log */
  .q { padding: 5px 0 6px; border-bottom: 1px solid var(--line-soft); }
  .q:last-child { border-bottom: 0; }
  .q .qn { font-size: 15px; }
  .q.active .qn { color: var(--gold); }
  .q .obj { font-size: 13px; color: var(--fg); padding-left: 14px; position: relative; margin-top: 2px; }
  .q .obj::before { content: "\25C6"; position: absolute; left: 0; top: 1px; font-size: 9px; color: var(--gold); }
  .q .obj.old { color: var(--fg-mute); }
  .q .obj.old::before { color: var(--fg-mute); }
  .q .where { font-size: 12px; color: var(--fg-dim); padding-left: 14px; }
  .q.other .qn { font-size: 14px; color: var(--fg-dim); }
  .q.other .obj { color: var(--fg-mute); font-size: 12px; }
  .q.other .obj::before { color: var(--fg-mute); }

  /* level + skills */
  .lvl { display: flex; align-items: center; gap: 10px; }
  .lvl .n { font-size: 26px; line-height: 1; }
  .lvl .bar { flex: 1; height: 6px; } .lvl .bar > i { background: var(--fg); }
  .lvl .pct { font-size: 12px; color: var(--fg-mute); }
  .skills { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .sk { display: grid; grid-template-columns: 1fr 26px; gap: 1px 6px; align-items: center; font-size: 13px; padding: 2px 3px; }
  .sk .bar { grid-column: 1 / 3; height: 3px; }
  .sk.gain { background: rgba(216,178,90,.12); box-shadow: inset 2px 0 0 var(--gold); }
  .sk.gain .bar > i { background: var(--gold); }

  /* maps */
  .mapview { position: relative; flex: 1 1 auto; min-height: 200px; background: #000; overflow: hidden; }
  .mapview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #worldMap { cursor: grab; }
  .mapctl { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
  .mapnote { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--fg-dim); background: rgba(0,0,0,.6); padding: 2px 8px; pointer-events: none; }
  .mapnote:empty { display: none; }
  .tooltip { position: absolute; pointer-events: none; background: rgba(0,0,0,.88); border: 1px solid var(--line); padding: 2px 8px; font-size: 13px; display: none; white-space: nowrap; }
  .banner { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); background: rgba(0,0,0,.92); border: 1px solid var(--gold);
    padding: 12px 16px; max-width: 520px; display: none; text-align: center; }
  .banner p { margin: 0 0 10px; }
  .localp { flex: 0 0 46%; }

  /* effects */
  .eff { display: grid; grid-template-columns: 22px 1fr auto; gap: 0 6px; align-items: center; font-size: 13px; padding: 3px 0; }
  .eff .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eff .src { grid-column: 2 / 4; font-size: 11px; color: var(--fg-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eff.bad .nm { color: #ffb3aa; }
  .ico { position: relative; width: 20px; height: 20px; }
  .ico img { width: 100%; height: 100%; object-fit: contain; }
  .ico .emb { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; }
  .ico.fallback { border: 1px solid var(--line); border-radius: 50%; }
  .toggle { cursor: pointer; user-select: none; }

  @media (max-width: 1100px) {
    html, body { overflow: auto; height: auto; }
    .app { height: auto; }
    .grid { grid-template-columns: 1fr; }
    .col.center { order: -1; }
    .mapview { min-height: 60vh; }
    .localp { flex: none; }
    .localp .mapview { min-height: 50vh; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="loc" id="whereBig">Skyrim Companion</span><span class="loc2" id="whereSmall"></span>
    <span class="when num" id="when"></span>
    <span class="conn"><span class="cdot" id="connDot"></span><span id="connText">Connecting…</span></span>
  </div>
  <div class="grid">
    <div class="col left">
      <section class="panel grow">
        <div class="ph"><h2>Quests</h2><span class="meta num" id="questCount"></span></div>
        <div class="pb" id="quests"><div class="empty">No quests yet</div></div>
      </section>
      <section class="panel">
        <div class="ph"><h2>Level and skills</h2></div>
        <div class="pb">
          <div class="lvl"><span class="n num" id="level">–</span><div class="bar"><i id="lvFill" style="width:0"></i></div><span class="pct num" id="lvPct"></span></div>
          <div id="skills" style="margin-top:8px"></div>
        </div>
      </section>
    </div>

    <div class="col center">
      <section class="panel grow">
        <div class="mapview">
          <canvas id="worldMap"></canvas>
          <div class="mapnote" id="mapNote"></div>
          <div class="mapctl">
            <button class="chipbtn on" id="btnFollow">Follow</button>
            <button class="chipbtn" id="btnFit">Whole map</button>
            <button class="chipbtn" id="btnSpoil">Undiscovered</button>
          </div>
          <div class="banner" id="banner"></div>
          <div class="tooltip" id="tooltip"></div>
        </div>
      </section>
    </div>

    <div class="col right">
      <section class="panel localp">
        <div class="ph"><h2>Local map</h2><span class="meta" id="localName"></span></div>
        <div class="mapview"><canvas id="localMap"></canvas><div class="mapnote" id="localNote"></div></div>
      </section>
      <section class="panel grow">
        <div class="ph"><h2>Active effects</h2><span class="meta num" id="effCount"></span></div>
        <div class="pb" id="effects"><div class="empty">No active effects</div></div>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clean = (x) => String(x || "").replace(/<[^>]*>/g, "").trim();
  const store = {
    get(k, d) { try { const v = localStorage.getItem("sc4." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("sc4." + k, JSON.stringify(v)); } catch {} }
  };
  const BASE = location.protocol.startsWith("http") ? "" : "http://localhost:7171";
  const ASSETS = "assets/";
  const FONT = () => getComputedStyle(document.body).fontFamily;

  const imgCache = new Map();
  function img(path) {
    let e = imgCache.get(path);
    if (!e) { e = { el: new Image(), ok: false }; e.el.onload = () => { e.ok = true; }; e.el.src = ASSETS + path; imgCache.set(path, e); }
    return e;
  }

  // ---------- map marker icons (CoMAP / Map Marker Framework configs) ----------
  const iconDefs = new Map(), refIcons = new Map(), typeScale = new Map();
  const normRef = (r) => { const [p, id] = String(r).split("|"); return p && id ? p.trim().toLowerCase() + "|" + parseInt(id, 16).toString(16) : ""; };
  function stripJsonComments(text) {
    let out = "", inStr = false, i = 0;
    while (i < text.length) {
      const c = text[i], n = text[i + 1];
      if (inStr) { out += c; if (c === "\\") { out += n ?? ""; i += 2; continue; } if (c === '"') inStr = false; i++; continue; }
      if (c === '"') { inStr = true; out += c; i++; continue; }
      if (c === "/" && n === "/") { while (i < text.length && text[i] !== "\n") i++; continue; }
      if (c === "/" && n === "*") { i += 2; while (i < text.length && !(text[i] === "*" && text[i + 1] === "/")) i++; i += 2; continue; }
      out += c; i++;
    }
    return out.replace(/,\s*([\]}])/g, "$1");
  }
  function loadMarkerConfigs(files) {
    const names = Object.keys(files).sort((a, b) => (a === "Skyrim.json" ? -1 : b === "Skyrim.json" ? 1 : a.localeCompare(b)));
    for (const name of names) {
      let cfg; try { cfg = JSON.parse(stripJsonComments(files[name])); } catch { continue; }
      for (const d of cfg.iconDefinitions || []) {
        if (d.name && d.source && d.source.exportNames) iconDefs.set(d.name, { exportName: d.source.exportNames[0], undiscovered: d.source.exportNames[1] || d.source.exportNames[0], scale: d.scale || 1 });
        else if (typeof d.index === "number" && d.scale) typeScale.set(d.index, d.scale);
      }
      for (const m of cfg.mapMarkers || []) {
        const key = normRef(m.refID); if (!key) continue;
        if (m.iconName) refIcons.set(key, { iconName: m.iconName }); else if (typeof m.icon === "number") refIcons.set(key, { icon: m.icon });
      }
    }
  }
  const safeFile = (s) => String(s).replace(/[^A-Za-z0-9 _-]/g, "_");
  function markerIcon(m) {
    const assign = m.ref ? refIcons.get(normRef(m.ref)) : null;
    let file, scale = 1;
    if (assign && assign.iconName && iconDefs.has(assign.iconName)) { const d = iconDefs.get(assign.iconName); file = m.discovered ? d.exportName : d.undiscovered; scale = d.scale; }
    else { const type = assign && typeof assign.icon === "number" ? assign.icon : m.type; if (type >= 1 && type <= 59) { file = "CoMAP " + type + (m.discovered ? "" : " Undiscovered"); scale = typeScale.get(type) || 1; } }
    return file ? { e: img("markers/" + safeFile(file) + ".png"), scale } : null;
  }
  function drawMarker(ctx, x, y, m, size) {
    const ic = markerIcon(m);
    if (ic && ic.e.ok) { const s = size * Math.min(1.6, ic.scale); ctx.save(); ctx.globalAlpha = m.discovered ? 1 : .75; ctx.drawImage(ic.e.el, x - s / 2, y - s / 2, s, s); ctx.restore(); return; }
    const r = m.type === 1 ? size * .42 : [2, 3, 54].includes(m.type) ? size * .34 : size * .26;
    ctx.save(); ctx.globalAlpha = m.discovered ? 1 : .5; ctx.fillStyle = "#2a241b"; ctx.strokeStyle = "#e9dcc0"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  function drawPlayer(ctx, x, y, headingDeg, size) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(headingDeg * Math.PI / 180);
    ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(size * .68, size * .78); ctx.lineTo(0, size * .38); ctx.lineTo(-size * .68, size * .78); ctx.closePath();
    ctx.fillStyle = "#f6efd9"; ctx.strokeStyle = "#1a140c"; ctx.lineWidth = 2.5; ctx.fill(); ctx.stroke(); ctx.restore();
  }
  function drawQuestDiamond(ctx, x, y, t) {
    const k = 6 + Math.sin(t / 300);
    ctx.save(); ctx.fillStyle = "#d8b25a"; ctx.strokeStyle = "#1a140c"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - k * 1.6); ctx.lineTo(x + k, y); ctx.lineTo(x, y + k * 1.6); ctx.lineTo(x - k, y); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  // Canvas pixels follow the element size (sharp on any monitor).
  function fitCanvas(cv) {
    const r = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * r) || cv.height !== Math.round(h * r)) { cv.width = Math.round(w * r); cv.height = Math.round(h * r); }
    cv.getContext("2d").setTransform(r, 0, 0, r, 0, 0);
  }

  // ---------- state ----------
  const app = { demo: false, state: null, shown: null, markers: [], worldspace: 0, mapInfo: null, mapImg: null, follow: true,
    view: { x: 0, y: 0, scale: .005 }, spoilers: store.get("spoilers", false), maps: null };
  let failures = 0, inflight = false;
  async function fetchJson(path) { const r = await fetch(BASE + path, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
  async function pollState() {
    if (app.demo || inflight) return; inflight = true;
    try { const s = await fetchJson("/api/state"); failures = 0; onState(s); }
    catch { failures++; if (failures === 15) showOffline(); setConn("bad", "Game not reachable"); }
    finally { inflight = false; }
  }
  async function pollMarkers() { if (!app.demo) try { onMarkers(await fetchJson("/api/markers")); } catch {} }
  function setConn(k, t) { $("connDot").className = "cdot " + k; $("connText").textContent = t; }
  function showOffline() {
    const b = $("banner");
    b.innerHTML = "<p>Can't reach the game. Start Skyrim through SKSE with Skyrim Companion installed and this page connects by itself.</p>";
    b.style.display = "block";
  }
  async function loadStatic() {
    try { app.maps = await (await fetch(ASSETS + "map/maps.json", { cache: "no-store" })).json(); } catch { app.maps = {}; }
    if (!app.demo) { try { loadMarkerConfigs(await fetchJson("/api/mapmarker-configs")); } catch {} }
  }

  // In-game hotkeys (zoom) arrive as numbered commands.
  let lastCmd = null;
  function runCommands(cmds) {
    if (!cmds || !cmds.length) return;
    const maxId = Math.max(...cmds.map(c => c.id));
    if (lastCmd === null) { lastCmd = maxId; return; }
    for (const c of cmds.filter(c => c.id > lastCmd)) {
      if (c.cmd === "zoomIn") app.view.scale = clamp(app.view.scale * 1.5, .0006, .08);
      else if (c.cmd === "zoomOut") app.view.scale = clamp(app.view.scale / 1.5, .0006, .08);
      else if (c.cmd === "toggleUndiscovered") setSpoil(!app.spoilers);
    }
    lastCmd = Math.max(lastCmd, maxId);
  }

  let lastSlow = 0;
  function onState(s) {
    runCommands(s.commands);
    if (!s.ready) { if (app.state) { local.data = null; local.version = 0; } app.state = null; setConn("wait", "Waiting for a loaded save…"); return; }
    $("banner").style.display = "none";
    setConn("ok", app.demo ? "Demo" : "Live");
    const prev = app.state; app.state = s;
    if (!app.shown || (prev && Math.hypot(s.player.x - prev.player.x, s.player.y - prev.player.y) > 3000)) app.shown = { x: s.player.x, y: s.player.y, h: s.player.heading };
    const ws = s.where.worldspaceId;
    if (ws && ws !== app.worldspace) { app.worldspace = ws; selectMap(s.where.worldspaceEdid); }
    renderHeader(s); renderProgress(s.progress); renderEffects(s.effects);
    $("mapNote").textContent = s.mapOpened === false && !app.demo ? "Open the map in game once to load the markers" : "";
    if (Date.now() - lastSlow > 900) { lastSlow = Date.now(); renderQuests(s.quests); }
  }
  function onMarkers(m) { const first = !app.markers.length; app.markers = m.markers || []; if (first && app.markers.length && !app.follow) fitWorld(); }
  function selectMap(edid) {
    const key = app.maps && Object.keys(app.maps).find(k => k.toLowerCase() === String(edid || "").toLowerCase());
    const info = key ? app.maps[key] : null; app.mapInfo = info || null; app.mapImg = info ? img(info.image) : null;
  }

  // ---------- header ----------
  const ordinal = (n) => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  function gameTime(s) {
    if (!s || !s.time) return "";
    const hr = s.time.hour, H = Math.floor(hr), M = Math.floor((hr - H) * 60);
    return ((H + 11) % 12 + 1) + ":" + String(M).padStart(2, "0") + (H < 12 ? " AM" : " PM");
  }
  function renderHeader(s) {
    const wh = s.where;
    $("whereBig").textContent = wh.interior ? (wh.cell || "Interior") : (wh.location || wh.worldspace || "Wilderness");
    $("whereSmall").textContent = wh.interior ? (wh.location && wh.location !== wh.cell ? wh.location : "") : (wh.location && wh.worldspace && wh.location !== wh.worldspace ? wh.worldspace : "");
    const tm = s.time; $("when").textContent = tm ? `${tm.dayName}, ${ordinal(tm.day)} of ${tm.month}, 4E ${tm.year} · ${gameTime(s)}` : "";
  }

  // ---------- quest log ----------
  // Active quests (the journal's Active toggle) first with every objective; the rest show their latest objective.
  function renderQuests(qs) {
    const el = $("quests"); qs = qs || [];
    $("questCount").textContent = qs.length ? qs.length + (qs.length === 1 ? " quest" : " quests") : "";
    if (!qs.length) { el.innerHTML = `<div class="empty">No quests yet</div>`; return; }
    const act = qs.filter(q => q.active), rest = qs.filter(q => !q.active);
    let html = "";
    if (act.length) {
      html += `<div class="grp">Active</div>`;
      for (const q of act) {
        const objs = (q.objectives || []).slice().reverse();
        const inside = objs.length && (objs[0].targets || []).find(t => t.interior && t.cell);
        html += `<div class="q active"><div class="qn">${esc(q.name)}</div>` +
          objs.map((o, i) => `<div class="obj ${i ? "old" : ""}">${esc(clean(o.text))}</div>`).join("") +
          (inside ? `<div class="where">in ${esc(inside.cell)}</div>` : "") + `</div>`;
      }
    }
    if (rest.length) {
      html += `<div class="grp">Other quests</div>`;
      for (const q of rest) {
        const o = (q.objectives || [])[(q.objectives || []).length - 1];
        html += `<div class="q other"><div class="qn">${esc(q.name)}</div>${o ? `<div class="obj">${esc(clean(o.text))}</div>` : ""}</div>`;
      }
    }
    el.innerHTML = html;
  }
  const activeTargets = (s) => { const out = []; for (const q of (s && s.quests) || []) if (q.active) for (const o of q.objectives || []) for (const t of o.targets || []) out.push(t); return out; };

  // ---------- level and skills ----------
  const GROUPS = [["Combat", 0], ["Stealth", 6], ["Magic", 12]];
  const skillXp = new Map(), skillLv = new Map(), skillGlow = new Map();
  function renderProgress(pr) {
    if (!pr) return;
    const s = app.state, frac = pr.threshold > 0 ? clamp(pr.xp / pr.threshold, 0, 1) : 0;
    $("level").textContent = s ? s.player.level : "–"; $("lvFill").style.width = (frac * 100) + "%"; $("lvPct").textContent = Math.floor(frac * 100) + "% to next";
    const now = Date.now(), sk = pr.skills || [];
    for (const x of sk) {
      if (skillXp.has(x.name) && (x.xp > skillXp.get(x.name) + 1e-4 || x.level > skillLv.get(x.name))) skillGlow.set(x.name, now + 3000);
      skillXp.set(x.name, x.xp); skillLv.set(x.name, x.level);
    }
    const row = (x) => { const f = x.threshold > 0 ? clamp(x.xp / x.threshold, 0, 1) : 0, g = (skillGlow.get(x.name) || 0) > now;
      return `<div class="sk ${g ? "gain" : ""}"><span>${esc(x.name)}</span><span class="num dim" style="text-align:right">${Math.round(x.level)}</span><div class="bar"><i style="width:${f * 100}%"></i></div></div>`; };
    $("skills").innerHTML = GROUPS.map(([name, i]) => `<div class="grp">${name}</div><div class="skills">${sk.slice(i, i + 6).map(row).join("")}</div>`).join("");
  }

  // ---------- active effects (SkyUI icon rules) ----------
  const ARCH = { 10: "conjure", 11: "invisibility", 12: "light", 17: "bound_item", 18: "conjure", 21: "paralysis", 25: "clairvoyance", 35: "cloak", 36: "werewolf", 37: "slow_time", 39: "ench_weapon", 41: "ethereal", 46: "vampire" };
  const AVI = {};
  ["av_skill_weapon_1h", "av_skill_weapon_2h", "av_skill_archery", "av_skill_block", "av_skill_smithing", "av_skill_armor_heavy", "av_skill_armor_light", "av_skill_pickpocket", "av_skill_lockpicking", "av_skill_sneak",
    "av_skill_alchemy", "av_skill_persuasion", "av_skill_alteration", "av_skill_conjuration", "av_skill_destruction", "av_skill_illusion", "av_skill_restoration", "av_skill_enchanting"]
    .forEach((s, i) => { AVI[6 + i] = s; AVI[96 + i] = s; AVI[114 + i] = s; AVI[135 + i] = s; });
  Object.assign(AVI, { 24: "av_health", 25: "av_magicka", 26: "av_stamina", 27: "av_health_regen", 28: "av_magicka_regen", 29: "av_stamina_regen", 30: "av_speedmult", 32: "av_carryweight", 34: "av_skill_unarmed", 35: "av_skill_unarmed",
    39: "av_resist_damage", 40: "av_resist_poison", 41: "av_resist_fire", 42: "av_resist_shock", 43: "av_resist_frost", 44: "av_resist_magic", 45: "av_resist_disease", 53: "paralysis", 54: "invisibility", 55: "av_nighteye",
    57: "av_waterbreathing", 58: "av_waterwalking", 63: "av_ward", 65: "av_armorperks", 78: "av_bow_speed", 83: "av_absorb", 85: "av_weapon_speed", 86: "av_skill_shout", 87: "av_bow_stagger", 92: "av_noise", 155: "av_health_regen", 156: "av_magicka_regen", 157: "av_stamina_regen" });
  function effectIcon(e) {
    let base = ARCH[e.archetype], emblem = null;
    if (!base) {
      if (e.archetype === 0 || e.archetype === 5 || e.archetype === 34) emblem = e.detrimental ? (e.recover ? "drain" : "damage") : (e.recover ? "fortify" : "restore");
      base = AVI[e.av];
      if (e.av === 24) { if (e.resist === 41) base = "fire"; else if (e.resist === 43) base = "frost"; else if (e.resist === 42) base = "shock"; }
      if (!base) base = "default_effect";
    }
    return { base, emblem };
  }
  function iconHtml(path, emblemPath) {
    return `<div class="ico"><img src="${ASSETS}${esc(path)}" alt="" onerror="this.parentNode.classList.add('fallback');this.remove()">` +
      (emblemPath ? `<img class="emb" src="${ASSETS}${esc(emblemPath)}" alt="" onerror="this.remove()">` : "") + `</div>`;
  }
  const fmtTime = (sec) => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}h ${m}m` : m ? `${m}:${String(s).padStart(2, "0")}` : `${s}s`; };
  const SPELLTYPE = { 0: "Spell", 1: "Disease", 2: "Power", 3: "Lesser power", 4: "Ability", 5: "Poison", 6: "Enchantment", 7: "Potion", 8: "Ingredient", 10: "Addiction", 11: "Shout", 12: "Staff", 13: "Scroll" };
  function effectSource(e) {
    const kind = SPELLTYPE[e.spellType] || "", parts = [];
    if (e.spellType === 6 && e.item) parts.push(e.item); else if (e.spell && e.spell !== e.name) parts.push(e.spell); else if (e.item) parts.push(e.item);
    let txt = kind ? kind + (parts.length ? ": " + parts.join(", ") : "") : parts.join(", ");
    if (e.caster && e.caster !== "You") txt += (txt ? " · " : "") + "from " + e.caster;
    return txt;
  }
  function effectRow(e) {
    const ic = effectIcon(e), timed = e.dur > 1, left = e.dur - e.elapsed;
    return `<div class="eff ${e.detrimental ? "bad" : ""}">${iconHtml("effects/" + ic.base + ".png", ic.emblem ? "effects/emblem_" + ic.emblem + ".png" : null)}
      <span class="nm">${esc(e.name)}${e.mag ? ` <span class="dim num">${Math.round(e.mag)}</span>` : ""}</span><span class="num dim">${timed ? fmtTime(left) : ""}</span>
      <span class="src">${esc(effectSource(e))}</span></div>`;
  }
  let abilitiesOpen = store.get("abilitiesOpen", false), lastEffKey = "";
  function renderEffects(list) {
    const all = (list || []).filter(e => e.name && !e.hidden && !e.inactive);
    const seen = new Set(), shown = [];
    for (const e of all) { const k = e.name + "|" + e.spell + "|" + e.item; if (!seen.has(k)) { seen.add(k); shown.push(e); } }
    const isAbility = (e) => e.spellType === 4 && !(e.dur > 1) && !e.detrimental;
    const main = shown.filter(e => !isAbility(e)), abil = shown.filter(isAbility);
    main.sort((a, b) => (b.detrimental - a.detrimental) || ((a.dur > 1 ? a.dur - a.elapsed : 1e9) - (b.dur > 1 ? b.dur - b.elapsed : 1e9)) || a.name.localeCompare(b.name));
    abil.sort((a, b) => a.name.localeCompare(b.name));
    $("effCount").textContent = main.length ? String(main.length) : "";
    let html = main.length ? main.map(effectRow).join("") : `<div class="empty">No active effects</div>`;
    if (abil.length) html += `<div class="grp toggle" id="abilToggle" style="margin-top:10px">${abilitiesOpen ? "▾" : "▸"} Abilities · ${abil.length}</div>` + (abilitiesOpen ? abil.map(effectRow).join("") : "");
    if (html === lastEffKey) return; lastEffKey = html;
    const el = $("effects"), top = el.scrollTop; el.innerHTML = html; el.scrollTop = top;
    const t = $("abilToggle"); if (t) t.onclick = () => { abilitiesOpen = !abilitiesOpen; store.set("abilitiesOpen", abilitiesOpen); lastEffKey = ""; renderEffects(app.state && app.state.effects); };
  }

  // ---------- world map ----------
  const world = $("worldMap"), wctx = world.getContext("2d");
  const W2S = (x, y) => [(x - app.view.x) * app.view.scale + world.clientWidth / 2, -(y - app.view.y) * app.view.scale + world.clientHeight / 2];
  const S2W = (sx, sy) => [(sx - world.clientWidth / 2) / app.view.scale + app.view.x, -(sy - world.clientHeight / 2) / app.view.scale + app.view.y];
  const visible = () => app.markers.filter(m => app.spoilers || m.seen || m.discovered);
  function fitWorld() {
    const w = world.clientWidth, h = world.clientHeight;
    if (app.mapInfo) { app.view.x = app.mapInfo.cx; app.view.y = app.mapInfo.cy; app.view.scale = Math.min(w, h) / app.mapInfo.span; return; }
    if (!app.markers.length) return;
    let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
    for (const m of app.markers) { a = Math.min(a, m.x); c = Math.max(c, m.x); b = Math.min(b, m.y); d = Math.max(d, m.y); }
    app.view.x = (a + c) / 2; app.view.y = (b + d) / 2; app.view.scale = Math.min(w / (c - a || 1), h / (d - b || 1)) * .9;
  }
  function drawWorld(t) {
    fitCanvas(world);
    const w = world.clientWidth, h = world.clientHeight, ctx = wctx, s = app.state;
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
    if (app.follow && app.shown) { app.view.x = app.shown.x; app.view.y = app.shown.y; }
    if (app.mapInfo && app.mapImg && app.mapImg.ok) {
      const { span, cx, cy } = app.mapInfo, [x0, y0] = W2S(cx - span / 2, cy + span / 2), [x1, y1] = W2S(cx + span / 2, cy - span / 2);
      ctx.drawImage(app.mapImg.el, x0, y0, x1 - x0, y1 - y0);
    }
    const size = clamp(app.view.scale * 2600, 16, 34), showLabels = app.view.scale > .01;
    ctx.font = "13px " + FONT(); ctx.textAlign = "center";
    for (const m of visible()) {
      const [x, y] = W2S(m.x, m.y); if (x < -30 || y < -30 || x > w + 30 || y > h + 30) continue;
      drawMarker(ctx, x, y, m, size);
      if (showLabels && m.name && m.discovered) { ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.8)"; ctx.fillStyle = "#f2efe8"; ctx.strokeText(m.name, x, y + size * .5 + 13); ctx.fillText(m.name, x, y + size * .5 + 13); }
    }
    if (s) for (const tg of activeTargets(s)) { if (tg.interior || tg.worldspaceId !== s.where.worldspaceId) continue; const [x, y] = W2S(tg.x, tg.y); drawQuestDiamond(ctx, x, y, t); }
    if (s && app.shown && !s.where.interior) { const [x, y] = W2S(app.shown.x, app.shown.y); drawPlayer(ctx, x, y, app.shown.h, 13); }
  }
  let drag = null;
  function setFollow(on) { app.follow = on; $("btnFollow").classList.toggle("on", on); }
  world.addEventListener("mousedown", (e) => { drag = { x: e.clientX, y: e.clientY, vx: app.view.x, vy: app.view.y }; });
  window.addEventListener("mousemove", (e) => {
    if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3 && app.follow) setFollow(false); if (!app.follow) { app.view.x = drag.vx - dx / app.view.scale; app.view.y = drag.vy + dy / app.view.scale; } }
    hoverTip(e);
  });
  window.addEventListener("mouseup", () => { drag = null; });
  world.addEventListener("wheel", (e) => {
    e.preventDefault(); const r = world.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, [gx, gy] = S2W(mx, my);
    app.view.scale = clamp(app.view.scale * Math.exp(-e.deltaY * .0015), .0006, .08);
    if (!app.follow) { const [nx, ny] = S2W(mx, my); app.view.x += gx - nx; app.view.y += gy - ny; }
  }, { passive: false });
  function hoverTip(e) {
    const tip = $("tooltip"), r = world.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    if (drag || mx < 0 || my < 0 || mx > r.width || my > r.height) { tip.style.display = "none"; return; }
    let best = null, bd = 14;
    for (const m of visible()) { const [x, y] = W2S(m.x, m.y), d = Math.hypot(x - mx, y - my); if (d < bd) { bd = d; best = m; } }
    if (!best) { tip.style.display = "none"; return; }
    tip.textContent = (best.name || "Unknown") + (best.discovered ? "" : " (undiscovered)"); tip.style.left = (mx + 14) + "px"; tip.style.top = (my + 10) + "px"; tip.style.display = "block";
  }
  function setSpoil(on) { app.spoilers = on; store.set("spoilers", on); $("btnSpoil").classList.toggle("on", on); }
  $("btnFollow").onclick = () => setFollow(!app.follow);
  $("btnFit").onclick = () => { setFollow(false); fitWorld(); };
  $("btnSpoil").onclick = () => setSpoil(!app.spoilers);
  setSpoil(app.spoilers);

  // ---------- local map (navmesh floor plan; explored parts, this play session) ----------
  const local = { data: null, version: 0, busy: false, bits: null, zoom: store.get("localZoom", 1) };
  async function pollLocal() {
    if (app.demo || local.busy || !app.state) return;
    local.busy = true;
    try { const r = await fetchJson("/api/localmap/" + local.version); if (!r.same && r.version) { local.data = r; local.version = r.version; local.bits = decodeBits(r.explored || ""); } }
    catch {} finally { local.busy = false; }
  }
  function decodeBits(hex) { const out = new Uint8Array(hex.length * 4); for (let i = 0; i < hex.length; i++) { const v = parseInt(hex[i], 16); for (let b = 0; b < 4; b++) out[i * 4 + b] = (v >> b) & 1; } return out; }
  const localCv = $("localMap"), lctx = localCv.getContext("2d");
  localCv.addEventListener("wheel", (e) => { e.preventDefault(); local.zoom = clamp(local.zoom * Math.exp(-e.deltaY * .0015), .4, 6); store.set("localZoom", local.zoom); }, { passive: false });
  function drawLocal(t) {
    fitCanvas(localCv);
    const w = localCv.clientWidth, h = localCv.clientHeight, s = app.state, d = local.data, ctx = lctx;
    ctx.fillStyle = "#0a0d0e"; ctx.fillRect(0, 0, w, h);
    $("localName").textContent = d && d.interior ? (d.name || "Interior") : "";
    if (!s || !app.shown || !d || !d.tris) { $("localNote").textContent = s ? "Loading…" : ""; return; }
    const v = d.verts, tr = d.tris, ex = local.bits || new Uint8Array(0), pz = s.player.z;
    // Interiors: fit the explored rooms. Outdoors: a window around you.
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    if (d.interior) for (let i = 0; i < tr.length; i += 3) { if (!ex[i / 3]) continue; for (let k = 0; k < 3; k++) { const a = tr[i + k] * 3; minX = Math.min(minX, v[a]); maxX = Math.max(maxX, v[a]); minY = Math.min(minY, v[a + 1]); maxY = Math.max(maxY, v[a + 1]); } }
    let cx, cy, span;
    if (d.interior && isFinite(minX)) { cx = (minX + maxX) / 2; cy = (minY + maxY) / 2; span = Math.max(maxX - minX, maxY - minY, 2500) + 800; }
    else { cx = app.shown.x; cy = app.shown.y; span = 9000; }
    const sc = Math.min(w, h) / span * local.zoom;
    if (d.interior && local.zoom > 1.05) { cx = app.shown.x; cy = app.shown.y; }  // zoomed in: follow you
    const toScreen = (x, y) => [(x - cx) * sc + w / 2, -(y - cy) * sc + h / 2];
    // Floors near your height are bright; floors above or below are faint.
    for (const pass of [0, 1]) {
      ctx.beginPath();
      for (let i = 0; i < tr.length; i += 3) {
        if (!ex[i / 3]) continue;
        const a = tr[i] * 3, b = tr[i + 1] * 3, c = tr[i + 2] * 3, near = Math.abs((v[a + 2] + v[b + 2] + v[c + 2]) / 3 - pz) < 400;
        if (near !== (pass === 1)) continue;
        const [x1, y1] = toScreen(v[a], v[a + 1]), [x2, y2] = toScreen(v[b], v[b + 1]), [x3, y3] = toScreen(v[c], v[c + 1]);
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath();
      }
      ctx.fillStyle = pass ? "rgba(190,200,195,.42)" : "rgba(120,130,130,.12)"; ctx.fill();
      ctx.strokeStyle = pass ? "rgba(210,220,215,.18)" : "rgba(150,160,160,.06)"; ctx.lineWidth = .5; ctx.stroke();
    }
    ctx.font = "12px " + FONT(); ctx.textAlign = "center";
    for (const dr of d.doors || []) {
      const [x, y] = toScreen(dr.x, dr.y); if (x < -10 || y < -10 || x > w + 10 || y > h + 10) continue;
      ctx.fillStyle = "#d8b25a"; ctx.fillRect(x - 3, y - 3, 6, 6);
      if (dr.to && sc > .05) { ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.85)"; ctx.strokeText(dr.to, x, y - 8); ctx.fillText(dr.to, x, y - 8); }
    }
    for (const tg of activeTargets(s)) {
      const here = s.where.interior ? tg.interior && tg.cellId === s.where.cellId : !tg.interior && tg.worldspaceId === s.where.worldspaceId;
      if (!here) continue;
      const [x, y] = toScreen(tg.x, tg.y);
      drawQuestDiamond(ctx, clamp(x, 10, w - 10), clamp(y, 14, h - 14), t);
    }
    const [px, py] = toScreen(app.shown.x, app.shown.y); drawPlayer(ctx, px, py, app.shown.h, 10);
    $("localNote").textContent = isFinite(minX) || !d.interior ? "" : "Walk around to reveal the map";
  }

  // ---------- render loop: smooth the player arrow between readings ----------
  function frame(t) {
    const s = app.state;
    if (s && app.shown) {
      const k = 0.25, p = s.player; app.shown.x += (p.x - app.shown.x) * k; app.shown.y += (p.y - app.shown.y) * k;
      let dh = ((p.heading - app.shown.h + 540) % 360) - 180; app.shown.h = (app.shown.h + dh * k + 360) % 360;
    }
    drawWorld(t); drawLocal(t);
    requestAnimationFrame(frame);
  }

  // ---------- demo (open with ?demo to preview without the game) ----------
  function startDemo() {
    app.demo = true;
    const sk = ["One-handed", "Two-handed", "Archery", "Block", "Smithing", "Heavy Armor", "Light Armor", "Pickpocket", "Lockpicking", "Sneak", "Alchemy", "Speech", "Alteration", "Conjuration", "Destruction", "Illusion", "Restoration", "Enchanting"];
    // A small two-room floor plan for the local map.
    const verts = [], tris = [];
    const room = (x0, y0, x1, y1, z) => { const b = verts.length / 3; verts.push(x0, y0, z, x1, y0, z, x1, y1, z, x0, y1, z); tris.push(b, b + 1, b + 2, b, b + 2, b + 3); };
    room(-1200, -800, 400, 600, 0); room(400, -200, 1800, 200, 0); room(1800, -900, 2800, 900, 0); room(-1200, 600, -400, 1600, 300);
    local.data = { version: 1, interior: true, name: "Bleak Falls Barrow", verts, tris, doors: [{ x: -1200, y: 0, to: "Skyrim" }, { x: 2800, y: 0, to: "Bleak Falls Sanctum" }] };
    local.bits = new Uint8Array(tris.length / 3).fill(1);
    let tick = 0;
    setInterval(() => {
      tick++;
      onState({ ready: true, mapOpened: true,
        player: { name: "Dovahkiin", level: 14, x: Math.sin(tick / 30) * 1200, y: Math.cos(tick / 40) * 300, z: 0, heading: (tick * 4) % 360 },
        where: { worldspaceId: 0x3C, worldspace: "Skyrim", worldspaceEdid: "Tamriel", cell: "Bleak Falls Barrow", cellId: 1, interior: true, location: "Bleak Falls Barrow" },
        time: { hour: 14.5, day: 17, dayName: "Middas", month: "Last Seed", year: 201 },
        progress: { xp: 340, threshold: 625, skills: sk.map((n, i) => ({ name: n, level: 15 + (i * 7) % 40, xp: (i * 37 + tick) % 100, threshold: 100 })) },
        quests: [
          { id: 1, name: "Bleak Falls Barrow", active: true, type: 1, objectives: [{ text: "Retrieve the Dragonstone", targets: [{ x: 2600, y: 400, interior: true, cellId: 1, cell: "Bleak Falls Barrow" }] }] },
          { id: 2, name: "The Golden Claw", active: true, type: 6, objectives: [{ text: "Find the golden claw" }, { text: "Return the golden claw to Lucan" }] },
          { id: 3, name: "Blood on the Ice", active: false, type: 8, objectives: [{ text: "Talk to the guard" }] },
          { id: 4, name: "The Wolf Queen Awakened", active: false, type: 8, objectives: [{ text: "Meet Falk Firebeard" }] }],
        effects: [
          { name: "Fortify One-handed", spell: "Potion of the Warrior", spellType: 7, archetype: 34, av: 6, mag: 20, dur: 60, elapsed: tick % 60, detrimental: false, recover: true },
          { name: "Frostbite", spell: "Frostbite", spellType: 0, archetype: 0, av: 26, resist: 43, mag: 8, dur: 5, elapsed: 1, detrimental: true, caster: "Draugr" },
          { name: "Well Rested", spellType: 4, archetype: 0, av: 96, mag: 10, dur: 0, elapsed: 0, detrimental: false, recover: true },
          { name: "Nord Frost Resistance", spellType: 4, archetype: 0, av: 43, mag: 50, dur: 0, elapsed: 0, detrimental: false }]
      });
    }, 100);
  }

  // ---------- start ----------
  (async () => {
    await loadStatic();
    if (/[?&]demo\b/.test(location.search)) startDemo();
    else { setInterval(pollState, 100); setInterval(pollMarkers, 5000); setInterval(pollLocal, 1000); pollMarkers(); }
    requestAnimationFrame(frame);
  })();
})();
</script>
